<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0b1020" />
<title>Voetbal Scorebord</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #0b1020; color: white;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .top-bar {
    position: relative;
    display: flex; align-items: center; justify-content: center; gap: 16px;
    padding: 10px; background: #11172b; border-bottom: 1px solid #1f2a44;
    font-size: clamp(16px, 2.5vh, 22px);
  }
  .version {
    position: absolute; top: 2px; right: 6px;
    font-size: 10px; opacity: 0.35;
    font-variant-numeric: tabular-nums;
    pointer-events: none; user-select: none;
  }
  .qbtn {
    background: #1f2a44; color: white; border: none; border-radius: 10px;
    width: 44px; height: 44px; font-size: 22px; font-weight: 700; cursor: pointer;
  }
  .qbtn:active { background: #2c3a5e; }
  .qlabel { min-width: 132px; text-align: center; font-weight: 600; letter-spacing: 0.5px; }
  /* Overall match/series score: e.g. penalty shootout or two-legged aggregate. */
  .series {
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    background: #1f2a44; border-radius: 10px; padding: 4px 12px;
    cursor: pointer; touch-action: manipulation; line-height: 1;
  }
  .series:active { background: #2c3a5e; }
  .series-cap { font-size: 9px; font-weight: 700; letter-spacing: 1px; opacity: 0.5; }
  .series-score { font-weight: 900; font-variant-numeric: tabular-nums; font-size: clamp(18px, 2.6vh, 26px); }
  .series-side.a { color: #60a5fa; }
  .series-side.b { color: #f87171; }
  .series-dash { opacity: 0.45; font-weight: 600; margin: 0 2px; }
  .clock {
    font-size: clamp(22px, 3.2vh, 32px);
    font-weight: 800; font-variant-numeric: tabular-nums;
    background: #1f2a44; color: white;
    border-radius: 10px; padding: 6px 14px;
    min-width: 104px; text-align: center;
    cursor: pointer; touch-action: manipulation;
  }
  .clock.running { background: #166534; }
  .teams {
    flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    padding: 8px; min-height: 0;
  }
  .team {
    position: relative; overflow: hidden;
    border-radius: 18px; padding: 14px;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    min-height: 0;
  }
  .team.home { background: linear-gradient(160deg, #1e3a8a, #1d4ed8); }
  .team.away { background: linear-gradient(160deg, #b91c1c, #dc2626); }
  .logo {
    position: absolute; top: 50%; left: 50%;
    width: 72%; max-width: 360px; height: auto;
    transform: translate(-50%, -50%);
    opacity: 0; pointer-events: none;
    transition: opacity 200ms ease;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.45));
    border-radius: 8px;
  }
  .logo.visible { opacity: 0.42; }
  .name-row, .score, .controls, .scorerow, .cards { position: relative; z-index: 1; }
  .name-row { display: flex; align-items: stretch; gap: 6px; width: 100%; }
  .name {
    background: rgba(255,255,255,0.1); border: none; color: white;
    font-size: clamp(18px, 3.5vh, 30px); font-weight: 700;
    text-align: center; flex: 1; min-width: 0; outline: none;
    user-select: text; -webkit-user-select: text;
    padding: 8px; border-radius: 8px;
    border: 1px dashed rgba(255,255,255,0.4);
  }
  .name:focus { background: rgba(255,255,255,0.2); border-style: solid; }
  .clear {
    flex: 0 0 auto; width: 44px;
    background: rgba(255,255,255,0.18); color: white;
    border: 1px solid rgba(255,255,255,0.4); border-radius: 8px;
    font-size: 20px; font-weight: 700; cursor: pointer; padding: 0;
  }
  .clear:active { background: rgba(255,255,255,0.3); }
  .logo-mini {
    flex: 0 0 auto; width: 44px; height: 44px; align-self: center;
    object-fit: contain; border-radius: 6px;
    background: rgba(255,255,255,0.9); padding: 3px;
    display: none;
  }
  .logo-mini.visible { display: block; }
  .logo-mini.has-roster { cursor: pointer; box-shadow: 0 0 0 2px rgba(96,165,250,0.95); }
  .logo-mini.has-roster:active { transform: scale(0.92); }
  .score {
    font-size: clamp(110px, 30vh, 260px);
    font-weight: 900; line-height: 1; margin: 4px 0;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 4px 20px rgba(0,0,0,0.3);
    cursor: pointer; touch-action: manipulation;
  }
  .controls {
    display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%;
  }
  .cards { display: flex; gap: 8px; }
  .card-btn {
    background: rgba(255,255,255,0.12); color: white;
    border: 1px solid rgba(255,255,255,0.4); border-radius: 8px;
    padding: 5px 12px; font-size: clamp(12px, 1.8vh, 15px); font-weight: 700;
    cursor: pointer; font-variant-numeric: tabular-nums;
    display: flex; align-items: center; gap: 5px;
  }
  .card-btn:active { transform: scale(0.95); }
  .card-swatch { width: 13px; height: 17px; border-radius: 2px; display: inline-block; }
  .card-swatch.y { background: #facc15; }
  .card-swatch.r { background: #ef4444; }
  .scorerow {
    display: grid; grid-template-columns: 1fr 2fr; gap: 6px; width: 100%;
  }
  .sbtn {
    background: white; border: none; border-radius: 12px;
    padding: 16px 0; font-size: clamp(16px, 2.6vh, 24px); font-weight: 800;
    cursor: pointer;
  }
  .sbtn:active { transform: scale(0.96); }
  .home .sbtn.goal { color: #1e3a8a; }
  .away .sbtn.goal { color: #b91c1c; }
  .sbtn.goal { letter-spacing: 0.5px; }
  .sbtn.minus {
    background: rgba(255,255,255,0.18); color: white !important;
    border: 1px solid rgba(255,255,255,0.5);
  }
  .footer {
    display: flex; justify-content: center; gap: 12px;
    padding: 10px; background: #11172b; border-top: 1px solid #1f2a44;
  }
  .footer button {
    background: #374151; color: white; border: none; border-radius: 10px;
    padding: 10px 22px; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .footer button.danger { background: #7f1d1d; }
  .footer button:active { opacity: 0.8; }
  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 70px);
    transform: translateX(-50%);
    background: rgba(17,23,43,0.95); color: white;
    border: 1px solid #1f2a44; border-radius: 10px;
    padding: 10px 16px; font-size: 16px; font-weight: 600;
    pointer-events: none; opacity: 0; transition: opacity 200ms ease;
    z-index: 10; max-width: 80vw; text-align: center;
  }
  .toast.show { opacity: 1; }
  .toast.err { border-color: #7f1d1d; color: #fecaca; }
  /* Player roster / stats modal */
  .modal {
    position: fixed; inset: 0; z-index: 50; display: none;
    align-items: center; justify-content: center;
    background: rgba(5,8,18,0.72);
    padding: calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 12px);
  }
  .modal.show { display: flex; }
  .modal-panel {
    background: #11172b; border: 1px solid #1f2a44; border-radius: 16px;
    width: 100%; max-width: 460px; max-height: 88vh;
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .modal-head {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; border-bottom: 1px solid #1f2a44;
  }
  .modal-head img { width: 34px; height: 34px; object-fit: contain; flex: 0 0 auto; border-radius: 4px; }
  .modal-title { flex: 1; min-width: 0; font-size: 18px; font-weight: 800; line-height: 1.15; }
  .modal-title small { display: block; font-size: 12px; font-weight: 500; opacity: 0.6; margin-top: 2px; }
  .modal-x, .modal-back {
    flex: 0 0 auto; height: 36px; min-width: 36px; padding: 0 11px;
    background: #1f2a44; color: #fff; border: none; border-radius: 9px;
    font-size: 18px; font-weight: 700; cursor: pointer;
  }
  .modal-back { font-size: 14px; }
  .modal-x:active, .modal-back:active { background: #2c3a5e; }
  .modal-body { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .roster-group {
    font-size: 12px; font-weight: 800; letter-spacing: 1px; opacity: 0.55;
    padding: 12px 14px 4px;
  }
  .roster-row {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 14px; cursor: pointer; border-bottom: 1px solid #1a2237;
  }
  .roster-row:active { background: #1a2237; }
  .roster-no {
    flex: 0 0 auto; width: 30px; text-align: center;
    font-size: 15px; font-weight: 800; color: #93c5fd; font-variant-numeric: tabular-nums;
  }
  .roster-flag { flex: 0 0 auto; font-size: 19px; line-height: 1; width: 24px; text-align: center; }
  .roster-name { flex: 1; min-width: 0; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .roster-pos {
    flex: 0 0 auto; font-size: 12px; font-weight: 700; min-width: 30px; text-align: center;
    color: #0b1020; background: rgba(255,255,255,0.85); border-radius: 6px; padding: 2px 7px;
  }
  .roster-pts { flex: 0 0 auto; width: 54px; text-align: right; font-size: 13px; opacity: 0.7; font-variant-numeric: tabular-nums; }
  .av {
    flex: 0 0 auto; width: 40px; height: 40px; border-radius: 50%;
    background: #222c46; border: 1px solid #2c3a5e; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800; color: #93c5fd; letter-spacing: 0.5px;
  }
  .av-lg { width: 104px; height: 104px; font-size: 32px; border-width: 2px; margin: 0 auto 14px; }
  .player-detail { padding: 16px 14px; }
  .player-detail h3 { margin: 0 0 3px; font-size: 23px; display: flex; align-items: center; gap: 9px; justify-content: center; }
  .player-detail h3 .pflag { font-size: 28px; line-height: 1; }
  .player-detail .meta { font-size: 14px; opacity: 0.7; margin-bottom: 16px; text-align: center; }
  .bio-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; }
  .bio-cell { background: #1a2237; border-radius: 10px; padding: 12px 8px; text-align: center; }
  .bio-cell .val { font-size: 18px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bio-cell .val.flag { font-size: 30px; line-height: 1.05; }
  .bio-cell .lbl { font-size: 12px; opacity: 0.6; margin-top: 4px; }
  .stat-title { font-size: 13px; font-weight: 700; opacity: 0.7; margin: 0 2px 8px; }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat-cell { background: linear-gradient(160deg, #1d4ed8, #1e3a8a); border-radius: 12px; padding: 16px 8px; text-align: center; }
  .stat-cell .val { font-size: 30px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .stat-cell .lbl { font-size: 13px; opacity: 0.85; margin-top: 4px; font-weight: 600; }
  @media (max-height: 480px) {
    .top-bar { padding: 6px; }
    .qbtn { width: 38px; height: 38px; }
    .footer { padding: 6px; }
    .footer button { padding: 8px 18px; }
  }
</style>
</head>
<body>
  <div class="top-bar">
    <div class="series" id="series" role="button" tabindex="0" aria-label="Eindstand penalty's / totaal — tik om toe te kennen, houd vast om handmatig in te stellen">
      <span class="series-cap">PENALTY'S</span>
      <span class="series-score"><span class="series-side a" id="seriesA">0</span><span class="series-dash">–</span><span class="series-side b" id="seriesB">0</span></span>
    </div>
    <button class="qbtn" id="qMinus" aria-label="Vorige periode">−</button>
    <div class="qlabel" id="qLabel">1E HELFT</div>
    <button class="qbtn" id="qPlus" aria-label="Volgende periode">+</button>
    <div class="clock" id="clock" role="timer" aria-label="Speelklok — tik om te starten/pauzeren, houd vast om te resetten">0:00</div>
    <div class="version" aria-hidden="true">v1 · 2026-06-26</div>
  </div>

  <div class="teams">
    <div class="team home">
      <img class="logo" id="logoA" alt="" />
      <div class="name-row">
        <img class="logo-mini" id="logoMiniA" alt="" />
        <input class="name" id="nameA" value="THUIS" placeholder="Tik om te benoemen" maxlength="30" />
        <button class="clear" data-clear="A" aria-label="Wis thuisnaam">×</button>
      </div>
      <div class="score" id="scoreA" role="button" aria-label="Doelpunt thuis">0</div>
      <div class="controls">
        <div class="cards">
          <button class="card-btn" data-card="A" data-color="y" aria-label="Gele kaart thuis"><span class="card-swatch y"></span><span id="yA">0</span></button>
          <button class="card-btn" data-card="A" data-color="r" aria-label="Rode kaart thuis"><span class="card-swatch r"></span><span id="rA">0</span></button>
        </div>
        <div class="scorerow">
          <button class="sbtn minus" data-team="A" data-amt="-1">−1</button>
          <button class="sbtn goal" data-team="A" data-amt="1">GOAL +1</button>
        </div>
      </div>
    </div>
    <div class="team away">
      <img class="logo" id="logoB" alt="" />
      <div class="name-row">
        <img class="logo-mini" id="logoMiniB" alt="" />
        <input class="name" id="nameB" value="UIT" placeholder="Tik om te benoemen" maxlength="30" />
        <button class="clear" data-clear="B" aria-label="Wis uitnaam">×</button>
      </div>
      <div class="score" id="scoreB" role="button" aria-label="Doelpunt uit">0</div>
      <div class="controls">
        <div class="cards">
          <button class="card-btn" data-card="B" data-color="y" aria-label="Gele kaart uit"><span class="card-swatch y"></span><span id="yB">0</span></button>
          <button class="card-btn" data-card="B" data-color="r" aria-label="Rode kaart uit"><span class="card-swatch r"></span><span id="rB">0</span></button>
        </div>
        <div class="scorerow">
          <button class="sbtn minus" data-team="B" data-amt="-1">−1</button>
          <button class="sbtn goal" data-team="B" data-amt="1">GOAL +1</button>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    <button id="reset" class="danger">Herbeginnen</button>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="playerModal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-panel">
      <div class="modal-head">
        <button class="modal-back" id="modalBack" style="display:none">‹ Terug</button>
        <img id="modalLogo" alt="" />
        <div class="modal-title" id="modalTitle"></div>
        <button class="modal-x" id="modalClose" aria-label="Sluiten">×</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  // Derive logo URLs: nation flags via flagcdn, club crests via ESPN CDN.
  function teamLogo(d) {
    if (d.kind === 'nation' && d.cc) return `https://flagcdn.com/w320/${d.cc}.png`;
    if (d.kind === 'club' && d.espn) return `https://a.espncdn.com/i/teamlogos/soccer/500/${d.espn}.png`;
    return '';
  }
  const TEAMS = DATA.map(d => ({ id: d.id, logo: teamLogo(d), names: d.names, kind: d.kind, group: d.group }));
  const ROSTERS = {};

  let scoreA = 0, scoreB = 0, period = 1;

  // --- Fuzzy team-name matching (same approach as the basketball scoreboard) ---
  function normalizeName(s) {
    return (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
  }
  function lev(a, b) {
    if (a === b) return 0;
    if (!a.length) return b.length;
    if (!b.length) return a.length;
    let prev = new Array(b.length + 1);
    let curr = new Array(b.length + 1);
    for (let j = 0; j <= b.length; j++) prev[j] = j;
    for (let i = 1; i <= a.length; i++) {
      curr[0] = i;
      for (let j = 1; j <= b.length; j++) {
        curr[j] = Math.min(prev[j] + 1, curr[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
      }
      [prev, curr] = [curr, prev];
    }
    return prev[b.length];
  }
  function findTeam(input) {
    const q = normalizeName(input);
    if (q.length < 2) return null;
    let best = null, bestRatio = 1;
    for (const t of TEAMS) {
      for (const alias of t.names) {
        const a = normalizeName(alias);
        if (q === a) return t;
        if (a.length >= 4 && (q.includes(a) || (q.length >= 4 && a.includes(q)))) {
          if (bestRatio > 0.05) { best = t; bestRatio = 0.05; }
          continue;
        }
        const d = lev(q, a);
        const ratio = d / Math.max(q.length, a.length);
        if (ratio <= 0.3 && ratio < bestRatio) { best = t; bestRatio = ratio; }
      }
    }
    return best;
  }

  function updateLogo(input, imgEl, miniEl) {
    const team = findTeam(input.value);
    const els = miniEl ? [imgEl, miniEl] : [imgEl];
    if (team && team.logo) {
      for (const el of els) {
        if (el.dataset.tid !== team.id) {
          el.dataset.tid = team.id;
          el.onerror = () => { el.classList.remove('visible'); };
          el.src = team.logo;
        }
        el.classList.add('visible');
      }
      if (miniEl) miniEl.classList.toggle('has-roster', !!(ROSTERS[team.id] && ROSTERS[team.id].players.length));
    } else {
      for (const el of els) {
        el.classList.remove('visible');
        el.removeAttribute('src');
        delete el.dataset.tid;
      }
      if (miniEl) miniEl.classList.remove('has-roster');
    }
  }

  // --- Count-up match clock (stopwatch). Tap = start/pause, hold = reset to 0:00. ---
  let clockMs = 0;
  let clockRunning = false;
  let clockStart = 0;
  let clockRaf = null;
  const clockEl = document.getElementById('clock');

  function getClockMs() {
    return clockRunning ? clockMs + (performance.now() - clockStart) : clockMs;
  }
  function formatClock(ms) {
    const totalSec = Math.floor(ms / 1000);
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    return m + ':' + String(s).padStart(2, '0');
  }
  function renderClock() {
    clockEl.textContent = formatClock(getClockMs());
    clockEl.classList.toggle('running', clockRunning);
    if (clockRunning) clockRaf = requestAnimationFrame(renderClock);
  }
  function startClock() {
    if (clockRunning) return;
    clockRunning = true;
    clockStart = performance.now();
    cancelAnimationFrame(clockRaf);
    renderClock();
  }
  function pauseClock() {
    if (!clockRunning) return;
    clockMs = getClockMs();
    clockRunning = false;
    cancelAnimationFrame(clockRaf);
    renderClock();
    save();
  }
  function resetClock() {
    clockRunning = false;
    clockMs = 0;
    cancelAnimationFrame(clockRaf);
    renderClock();
  }

  let clockPressTimer = null, clockLongPressed = false;
  clockEl.addEventListener('pointerdown', () => {
    clockLongPressed = false;
    clearTimeout(clockPressTimer);

      clockLongPressed = true;
      if (navigator.vibrate) { try { navigator.vibrate(40); } catch (e) {} }
      resetClock();
      save();
    }, 600);
  });
  const cancelClockPress = () => clearTimeout(clockPressTimer);
  clockEl.addEventListener('pointerleave', cancelClockPress);
  clockEl.addEventListener('pointercancel', cancelClockPress);
  clockEl.addEventListener('pointerup', () => {
    clearTimeout(clockPressTimer);
    if (clockLongPressed) return;
    if (clockRunning) pauseClock(); else startClock();
  });

  // --- Persistence ---
  const STORAGE_KEY = 'soccer_scoreboard_state_v1';
  let useLocalStorage = true;
  try { localStorage.setItem('__test__', '1'); localStorage.removeItem('__test__'); }
  catch (e) { useLocalStorage = false; }

  function save() {
    const state = {
      a: scoreA, b: scoreB, p: period, na: nameA.value, nb: nameB.value,
      c: Math.round(getClockMs()),
      ya: yellowA, yb: yellowB, ra: redA, rb: redB, ga: seriesA, gb: seriesB
    };
    if (useLocalStorage) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    } else {
      try { history.replaceState(null, '', '#' + btoa(JSON.stringify(state))); } catch (e) {}
    }
  }
  function load() {
    let raw = null;
    if (useLocalStorage) { try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) {} }
    if (!raw && location.hash.length > 1) { try { raw = atob(location.hash.slice(1)); } catch (e) {} }
    if (!raw) return;
    try {
      const s = JSON.parse(raw);
      scoreA = s.a || 0; scoreB = s.b || 0; period = s.p || 1;
      yellowA = s.ya || 0; yellowB = s.yb || 0; redA = s.ra || 0; redB = s.rb || 0;
      seriesA = s.ga || 0; seriesB = s.gb || 0;
      if (s.na) nameA.value = s.na;
      if (s.nb) nameB.value = s.nb;
      if (typeof s.c === 'number' && s.c >= 0) clockMs = s.c;
    } catch (e) {}
  }

  function render() {
    sa.textContent = scoreA;

  // --- Penalty / aggregate score (top-left) ---
  function awardMatch() {
    if (scoreA === scoreB) { toast('Gelijkspel — geen winnaar', true); return; }
    const winnerA = scoreA > scoreB;
    const winName = (winnerA ? nameA.value : nameB.value).trim() || (winnerA ? 'Thuis' : 'Uit');

    if (winnerA) seriesA++; else seriesB++;
    scoreA = 0; scoreB = 0; period = 1;

    const input = prompt('Stand (thuis-uit):', seriesA + '-' + seriesB);
    if (input === null) return;
    const parts = input.split(/[^0-9]+/).filter(Boolean).map(n => parseInt(n, 10));
    if (parts.length >= 2 && parts[0] >= 0 && parts[1] >= 0) {
      seriesA = parts[0]; seriesB = parts[1]; render();
    } else { toast('Ongeldige stand', true); }
  }
  const seriesEl = document.getElementById('series');
  let seriesPressTimer = null, seriesLongPressed = false;
  seriesEl.addEventListener('pointerdown', () => {
    seriesLongPressed = false;
    clearTimeout(seriesPressTimer);
    seriesPressTimer = setTimeout(() => {
      seriesLongPressed = true;
      if (navigator.vibrate) { try { navigator.vibrate(40); } catch (e) {} }
      editSeries();
    }, 600);
  });
  const cancelSeriesPress = () => clearTimeout(seriesPressTimer);
  seriesEl.addEventListener('pointerleave', cancelSeriesPress);
  seriesEl.addEventListener('pointercancel', cancelSeriesPress);
  seriesEl.addEventListener('pointerup', () => {
    clearTimeout(seriesPressTimer);
    if (seriesLongPressed) return;
    awardMatch();
  });

  // --- Toast ---
  const toastEl = document.getElementById('toast');
  let toastTimer = null;
  function toast(msg, isErr) {
    toastEl.textContent = msg;
    toastEl.classList.toggle('err', !!isErr);
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  // --- Prevent double-tap zoom / keep screen awake ---
  document.addEventListener('touchstart', function(e){ if(e.touches.length>1) e.preventDefault(); }, {passive:false});
  let lastTouch = 0;
  document.addEventListener('touchend', function(e){
    const now = Date.now();
    if (now - lastTouch <= 300 && e.target.tagName !== 'INPUT') e.preventDefault();
    lastTouch = now;
  }, {passive:false});
  let wakeLock = null;
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && wakeLock === null) requestWakeLock();
  });
  requestWakeLock();

  // --- Player roster / stats modal ---
  const teamById = Object.fromEntries(TEAMS.map(t => [t.id, t]));
  const modal = document.getElementById('playerModal');
  const modalBody = document.getElementById('modalBody');
  const modalTitle = document.getElementById('modalTitle');
  const modalLogo = document.getElementById('modalLogo');
  const modalBack = document.getElementById('modalBack');
  const modalClose = document.getElementById('modalClose');
  let modalTeamId = null;

  function esc(s) {
    return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  }
  const POS_NAME = { GK:'Keeper', DF:'Verdediger', MF:'Middenvelder', FW:'Aanvaller' };
  const POS_ORDER = { GK:0, DF:1, MF:2, FW:3 };

  // Country code -> flag emoji. Special-cases the UK home nations (no ISO2),
  // accepting both short ('en') and flagcdn-style ('gb-eng') codes.
  const ENG = '🏴\u{E0067}\u{E0062}\u{E0065}\u{E006E}\u{E0067}\u{E007F}';
  const SCT = '🏴\u{E0067}\u{E0062}\u{E0073}\u{E0063}\u{E0074}\u{E007F}';
  const WLS = '🏴\u{E0067}\u{E0062}\u{E0077}\u{E006C}\u{E0073}\u{E007F}';
  const SPECIAL_FLAG = {
    en: ENG, 'gb-eng': ENG, sct: SCT, 'gb-sct': SCT, wls: WLS, 'gb-wls': WLS
  };
  function flag(cc) {
    if (!cc) return '';
    cc = cc.toLowerCase();
    if (SPECIAL_FLAG[cc]) return SPECIAL_FLAG[cc];
    if (cc.length !== 2) return '';
    const base = 0x1F1E6;
    return String.fromCodePoint(...[...cc.toUpperCase()].map(c => base + c.charCodeAt(0) - 65));
  }
  function initials(name) {
    return name.split(/[\s-]+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
  }
  function avatar(name, cls) {
    return `<div class="av ${cls}">${esc(initials(name))}</div>`;
  }

  function sortedPlayers(data) {
    return data.players.map((p, i) => ({ p, i }))
      .sort((x, y) => (POS_ORDER[x.p.pos] ?? 9) - (POS_ORDER[y.p.pos] ?? 9) || (x.p.no || 99) - (y.p.no || 99));
  }

  function showRosterList() {
    const data = ROSTERS[modalTeamId];
    modalBack.style.display = 'none';
    modalTitle.innerHTML = `${esc(data.city)} ${esc(data.name)}<small>${data.players.length} spelers · tik op een speler</small>`;
    let html = '', lastPos = null;
    for (const { p, i } of sortedPlayers(data)) {
      if (p.pos !== lastPos) {
        html += `<div class="roster-group">${esc(POS_NAME[p.pos] ? POS_NAME[p.pos].toUpperCase() + 'S' : p.pos)}</div>`;
        lastPos = p.pos;
      }
      html += `<div class="roster-row" data-idx="${i}">
         <span class="roster-no">${esc(p.no || '')}</span>
         ${avatar(p.n, '')}
         <span class="roster-flag">${flag(p.nat)}</span>
         <span class="roster-name">${esc(p.n)}</span>
         <span class="roster-pos">${esc(p.pos)}</span>
         <span class="roster-pts">${esc(p.gls || 0)} ⚽</span>
       </div>`;
    }
    modalBody.innerHTML = html;
    modalBody.scrollTop = 0;
  }

  function showPlayer(idx) {
    const data = ROSTERS[modalTeamId];
    const p = data.players[idx];
    if (!p) return;
    modalBack.style.display = '';
    modalTitle.innerHTML = `${esc(data.city)} ${esc(data.name)}<small>Speler</small>`;
    const bio = [
      ['flag', flag(p.nat) || '—', 'Land'],
      ['', (p.age ? p.age + ' jr' : '—'), 'Leeftijd'],
      ['', (p.club || '—'), 'Club']
    ];
    const stats = [
      [p.gls || 0, 'Goals'],
      [p.ast || 0, 'Assists'],
      [p.apps || 0, data.kind === 'nation' ? 'Caps' : 'Duels']
    ];
    modalBody.innerHTML =
      `<div class="player-detail">
         ${avatar(p.n, 'av-lg')}
         <h3><span class="pflag">${flag(p.nat)}</span>${esc(p.n)}</h3>
         <div class="meta">#${esc(p.no || '–')} · ${esc(POS_NAME[p.pos] || p.pos)}</div>
         <div class="bio-row">
           ${bio.map(([cls, v, l]) => `<div class="bio-cell"><div class="val ${cls}">${esc(v)}</div><div class="lbl">${esc(l)}</div></div>`).join('')}
         </div>
         <div class="stat-title">Statistieken</div>
         <div class="stat-grid">
           ${stats.map(([v, l]) => `<div class="stat-cell"><div class="val">${esc(v)}</div><div class="lbl">${esc(l)}</div></div>`).join('')}
         </div>
       </div>`;
    modalBody.scrollTop = 0;
  }

  function openRoster(teamId) {
    if (!ROSTERS[teamId] || !ROSTERS[teamId].players.length) return;
    modalTeamId = teamId;
    const team = teamById[teamId];
    if (team && team.logo) modalLogo.src = team.logo; else modalLogo.removeAttribute('src');
    showRosterList();
    modal.classList.add('show');
    modal.setAttribute('aria-hidden', 'false');
  }
  function closeModal() {
    modal.classList.remove('show');
    modal.setAttribute('aria-hidden', 'true');
    modalTeamId = null;
  }
  modalBody.addEventListener('click', e => {
    const row = e.target.closest('.roster-row');
    if (row) showPlayer(parseInt(row.dataset.idx, 10));
  });
  modalBack.addEventListener('click', showRosterList);
  modalClose.addEventListener('click', closeModal);
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal.classList.contains('show')) closeModal(); });
  logoMiniA.addEventListener('click', () => { if (logoMiniA.dataset.tid) openRoster(logoMiniA.dataset.tid); });
  logoMiniB.addEventListener('click', () => { if (logoMiniB.dataset.tid) openRoster(logoMiniB.dataset.tid); });

  load();
  render();
  renderClock();
  updateLogo(nameA, logoA, logoMiniA);
  updateLogo(nameB, logoB, logoMiniB);
</script>
</body>
</html>
