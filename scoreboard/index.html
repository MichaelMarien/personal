<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0b1020" />
<title>Scoreboard</title>
<script src="https://cdn.jsdelivr.net/npm/vosk-browser@0.0.8/dist/vosk.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #0b1020; color: white;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .quarter-bar {
    position: relative;
    display: flex; align-items: center; justify-content: center; gap: 16px;
    padding: 10px; background: #11172b; border-bottom: 1px solid #1f2a44;
    font-size: clamp(16px, 2.5vh, 22px);
  }
  .version {
    position: absolute; top: 2px; right: 6px;
    font-size: 10px; opacity: 0.35;
    font-variant-numeric: tabular-nums;
    pointer-events: none; user-select: none;
  }
  .qbtn {
    background: #1f2a44; color: white; border: none; border-radius: 10px;
    width: 44px; height: 44px; font-size: 22px; font-weight: 700; cursor: pointer;
  }
  .qbtn:active { background: #2c3a5e; }
  .qlabel { min-width: 110px; text-align: center; font-weight: 600; letter-spacing: 0.5px; }
  .clock {
    font-size: clamp(22px, 3.2vh, 32px);
    font-weight: 800; font-variant-numeric: tabular-nums;
    background: #1f2a44; color: white;
    border-radius: 10px; padding: 6px 14px;
    min-width: 96px; text-align: center;
    cursor: pointer; touch-action: manipulation;
  }
  .clock.running { background: #166534; }
  .clock.expired { background: #7f1d1d; animation: clockPulse 0.9s infinite; }
  @keyframes clockPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(220,38,38,0.6); }
    50% { box-shadow: 0 0 0 10px rgba(220,38,38,0); }
  }
  .teams {
    flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    padding: 8px; min-height: 0;
  }
  .team {
    position: relative; overflow: hidden;
    border-radius: 18px; padding: 14px;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    min-height: 0;
  }
  .team.home { background: linear-gradient(160deg, #1e3a8a, #1d4ed8); }
  .team.away { background: linear-gradient(160deg, #b91c1c, #dc2626); }
  .logo {
    position: absolute; top: 50%; left: 50%;
    width: 80%; max-width: 420px; height: auto;
    transform: translate(-50%, -50%);
    opacity: 0; pointer-events: none;
    transition: opacity 200ms ease;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
  }
  .logo.visible { opacity: 0.5; }
  .name-row, .score, .buttons { position: relative; z-index: 1; }
  .name-row { display: flex; align-items: stretch; gap: 6px; width: 100%; }
  .name {
    background: rgba(255,255,255,0.1); border: none; color: white;
    font-size: clamp(18px, 3.5vh, 30px); font-weight: 700;
    text-align: center; flex: 1; min-width: 0; outline: none;
    user-select: text; -webkit-user-select: text;
    padding: 8px; border-radius: 8px;
    border: 1px dashed rgba(255,255,255,0.4);
  }
  .name:focus { background: rgba(255,255,255,0.2); border-style: solid; }
  .clear {
    flex: 0 0 auto; width: 44px;
    background: rgba(255,255,255,0.18); color: white;
    border: 1px solid rgba(255,255,255,0.4); border-radius: 8px;
    font-size: 20px; font-weight: 700; cursor: pointer; padding: 0;
  }
  .clear:active { background: rgba(255,255,255,0.3); }
  .logo-mini {
    flex: 0 0 auto; width: 44px; height: 44px; align-self: center;
    object-fit: contain; border-radius: 6px;
    background: rgba(255,255,255,0.9); padding: 3px;
    display: none;
  }
  .logo-mini.visible { display: block; }
  .seed {
    flex: 0 0 auto; align-self: center; display: none;
    min-width: 22px; height: 22px; padding: 0 5px;
    align-items: center; justify-content: center;
    font-size: 15px; font-weight: 800; line-height: 1;
    font-variant-numeric: tabular-nums;
    color: #0b1020; background: rgba(255,255,255,0.92);
    border-radius: 6px;
  }
  .seed.visible { display: inline-flex; }
  .score {
    font-size: clamp(110px, 28vh, 240px);
    font-weight: 900; line-height: 1; margin: 6px 0;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .buttons {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%;
  }
  .sbtn {
    background: white; border: none; border-radius: 12px;
    padding: 14px 0; font-size: clamp(16px, 2.5vh, 22px); font-weight: 800;
    cursor: pointer;
  }
  .sbtn:active { transform: scale(0.95); }
  .home .sbtn { color: #1e3a8a; }
  .away .sbtn { color: #b91c1c; }
  .sbtn.minus {
    background: rgba(255,255,255,0.18); color: white !important;
    border: 1px solid rgba(255,255,255,0.5);
  }
  .footer {
    display: flex; justify-content: center; gap: 12px;
    padding: 10px; background: #11172b; border-top: 1px solid #1f2a44;
  }
  .footer button {
    background: #374151; color: white; border: none; border-radius: 10px;
    padding: 10px 22px; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .footer button.danger { background: #7f1d1d; }
  .footer button.mic { background: #1f2937; display: flex; align-items: center; gap: 8px; }
  .footer button.mic.on { background: #b91c1c; box-shadow: 0 0 0 0 rgba(220,38,38,0.7); animation: pulse 1.4s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(220,38,38,0.6); }
    70% { box-shadow: 0 0 0 12px rgba(220,38,38,0); }
    100% { box-shadow: 0 0 0 0 rgba(220,38,38,0); }
  }
  .footer button:active { opacity: 0.8; }
  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 70px);
    transform: translateX(-50%);
    background: rgba(17,23,43,0.95); color: white;
    border: 1px solid #1f2a44; border-radius: 10px;
    padding: 10px 16px; font-size: 16px; font-weight: 600;
    pointer-events: none; opacity: 0; transition: opacity 200ms ease;
    z-index: 10; max-width: 80vw; text-align: center;
  }
  .toast.show { opacity: 1; }
  .toast.err { border-color: #7f1d1d; color: #fecaca; }
  /* Player roster / stats modal */
  .logo-mini { cursor: default; transition: box-shadow 150ms ease; }
  .logo-mini.has-roster { cursor: pointer; box-shadow: 0 0 0 2px rgba(96,165,250,0.9); }
  .logo-mini.has-roster:active { transform: scale(0.92); }
  .modal {
    position: fixed; inset: 0; z-index: 50; display: none;
    align-items: center; justify-content: center;
    background: rgba(5,8,18,0.72);
    padding: calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 12px);
  }
  .modal.show { display: flex; }
  .modal-panel {
    background: #11172b; border: 1px solid #1f2a44; border-radius: 16px;
    width: 100%; max-width: 460px; max-height: 88vh;
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .modal-head {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; border-bottom: 1px solid #1f2a44;
  }
  .modal-head img { width: 34px; height: 34px; object-fit: contain; flex: 0 0 auto; }
  .modal-title { flex: 1; min-width: 0; font-size: 18px; font-weight: 800; line-height: 1.15; }
  .modal-title small { display: block; font-size: 12px; font-weight: 500; opacity: 0.6; margin-top: 2px; }
  .modal-x, .modal-back {
    flex: 0 0 auto; height: 36px; min-width: 36px; padding: 0 11px;
    background: #1f2a44; color: #fff; border: none; border-radius: 9px;
    font-size: 18px; font-weight: 700; cursor: pointer;
  }
  .modal-back { font-size: 14px; }
  .modal-x:active, .modal-back:active { background: #2c3a5e; }
  .modal-body { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .roster-row {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 14px; cursor: pointer; border-bottom: 1px solid #1a2237;
  }
  .roster-row:active { background: #1a2237; }
  .roster-no {
    flex: 0 0 auto; width: 32px; text-align: center;
    font-size: 15px; font-weight: 800; color: #93c5fd; font-variant-numeric: tabular-nums;
  }
  .roster-name { flex: 1; min-width: 0; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .roster-pos {
    flex: 0 0 auto; font-size: 12px; font-weight: 700;
    color: #0b1020; background: rgba(255,255,255,0.85); border-radius: 6px; padding: 2px 7px;
  }
  .roster-pts { flex: 0 0 auto; width: 62px; text-align: right; font-size: 13px; opacity: 0.7; font-variant-numeric: tabular-nums; }
  .player-detail { padding: 16px 14px; }
  .player-detail h3 { margin: 0 0 3px; font-size: 22px; }
  .player-detail .meta { font-size: 13px; opacity: 0.65; margin-bottom: 16px; }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat-cell { background: #1a2237; border-radius: 10px; padding: 12px 8px; text-align: center; }
  .stat-cell .val { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat-cell .lbl { font-size: 11px; opacity: 0.6; margin-top: 3px; text-transform: uppercase; letter-spacing: 0.5px; }
  /* Landscape phone tweaks */
  @media (max-height: 480px) {
    .quarter-bar { padding: 6px; }
    .qbtn { width: 38px; height: 38px; }
    .footer { padding: 6px; }
    .footer button { padding: 8px 18px; }
  }
</style>
</head>
<body>
  <div class="quarter-bar">
    <button class="qbtn" id="qMinus" aria-label="Previous quarter">−</button>
    <div class="qlabel" id="qLabel">QUARTER 1</div>
    <button class="qbtn" id="qPlus" aria-label="Next quarter">+</button>
    <div class="clock" id="clock" role="timer" aria-label="Game clock — tap to start/pause, hold to reset">10:00</div>
    <div class="version" aria-hidden="true">v5 · 2026-05-24</div>
  </div>

  <div class="teams">

        <img class="logo-mini" id="logoMiniA" alt="" />
        <input class="name" id="nameA" value="HOME" placeholder="Tap to name" maxlength="30" />
        <button class="clear" data-clear="A" aria-label="Clear home name">×</button>
      </div>
      <div class="score" id="scoreA">0</div>
      <div class="buttons">
        <button class="sbtn" data-team="A" data-amt="1">+1</button>
        <button class="sbtn" data-team="A" data-amt="2">+2</button>
        <button class="sbtn" data-team="A" data-amt="3">+3</button>
        <button class="sbtn minus" data-team="A" data-amt="-1">−1</button>
      </div>
    </div>
    <div class="team away">
      <img class="logo" id="logoB" alt="" />
      <div class="name-row">
        <img class="logo-mini" id="logoMiniB" alt="" />
        <span class="seed" id="seedB" aria-hidden="true"></span>
        <input class="name" id="nameB" value="AWAY" placeholder="Tap to name" maxlength="30" />
        <button class="clear" data-clear="B" aria-label="Clear away name">×</button>
      </div>
      <div class="score" id="scoreB">0</div>
      <div class="buttons">
        <button class="sbtn" data-team="B" data-amt="1">+1</button>
        <button class="sbtn" data-team="B" data-amt="2">+2</button>
        <button class="sbtn" data-team="B" data-amt="3">+3</button>
        <button class="sbtn minus" data-team="B" data-amt="-1">−1</button>
      </div>
    </div>
  </div>

  <div class="footer">
    <button id="mic" class="mic" aria-label="Voice input">
      <span id="micIcon">🎤</span><span id="micLabel">Spraak</span>
    </button>
    <button id="reset" class="danger">Herbeginnen</button>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="playerModal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-panel">
      <div class="modal-head">
        <button class="modal-back" id="modalBack" style="display:none">‹ Terug</button>
        <img id="modalLogo" alt="" />
        <div class="modal-title" id="modalTitle"></div>
        <button class="modal-x" id="modalClose" aria-label="Sluiten">×</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  function normalizeName(s) {
    return (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
  }

  function lev(a, b) {
    if (a === b) return 0;
    if (!a.length) return b.length;
    if (!b.length) return a.length;
    let prev = new Array(b.length + 1);
    let curr = new Array(b.length + 1);
    for (let j = 0; j <= b.length; j++) prev[j] = j;
    for (let i = 1; i <= a.length; i++) {
      curr[0] = i;
      for (let j = 1; j <= b.length; j++) {
        curr[j] = Math.min(
          prev[j] + 1,
          curr[j-1] + 1,
          prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1)
        );
      }
      [prev, curr] = [curr, prev];
    }
    return prev[b.length];
  }

  function findTeam(input) {
    const q = normalizeName(input);
    if (q.length < 2) return null;
    let best = null, bestRatio = 1;
    for (const t of TEAMS) {
      for (const alias of t.names) {
        const a = normalizeName(alias);
        if (q === a) return t;
        if (a.length >= 4 && (q.includes(a) || (q.length >= 4 && a.includes(q)))) {
          if (bestRatio > 0.05) { best = t; bestRatio = 0.05; }
          continue;
        }
        const d = lev(q, a);
        const ratio = d / Math.max(q.length, a.length);
        if (ratio <= 0.3 && ratio < bestRatio) { best = t; bestRatio = ratio; }
      }
    }
    return best;
  }

  function updateLogo(input, imgEl, miniEl, seedEl) {
    const team = findTeam(input.value);
    const els = miniEl ? [imgEl, miniEl] : [imgEl];
    if (team) {
      for (const el of els) {
        if (el.dataset.tid !== team.id) {
          el.dataset.tid = team.id;
          el.src = team.logo;
        }
        el.classList.add('visible');
      }
      if (miniEl) miniEl.classList.toggle('has-roster', !!ROSTERS[team.id]);
      if (seedEl) {
        if (team.seed) {
          seedEl.textContent = team.seed;
          seedEl.classList.add('visible');
        } else {
          seedEl.textContent = '';
          seedEl.classList.remove('visible');
        }
      }
    } else {
      for (const el of els) {
        el.classList.remove('visible');
        el.removeAttribute('src');
        delete el.dataset.tid;
      }
      if (miniEl) miniEl.classList.remove('has-roster');
      if (seedEl) {
        seedEl.textContent = '';
        seedEl.classList.remove('visible');
      }
    }
  }

  function formatClock(ms) {
    if (ms <= 0) return '0:00.0';
    const totalSec = ms / 1000;
    if (totalSec >= 60) {

    if (clockMs <= 0) return;
    unlockAudio();
    clockRunning = true;
    clockEnd = performance.now() + clockMs;
    renderClock();
  }

  function pauseClock() {
    if (!clockRunning) return;
    clockMs = Math.max(0, clockEnd - performance.now());
    clockRunning = false;
    cancelAnimationFrame(clockRaf);
    renderClock();
    save();
  }

  function resetClock() {
    clockRunning = false;
    cancelAnimationFrame(clockRaf);
    clockMs = CLOCK_DEFAULT_MS;
    renderClock();
    save();
  }

  function buzzer() {
    save();
    if (navigator.vibrate) { try { navigator.vibrate([400, 80, 400, 80, 400]); } catch (e) {} }
    if (!clockAudio) {
      try { clockAudio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }
    if (!clockAudio) return;
    try {
      if (clockAudio.state === 'suspended') clockAudio.resume();
      const ctx = clockAudio;
      const t0 = ctx.currentTime;
      const dur = 2.2;

      // Master envelope: fast attack, hold, short tail.
      const master = ctx.createGain();
      master.gain.setValueAtTime(0.0001, t0);
      master.gain.exponentialRampToValueAtTime(0.7, t0 + 0.02);
      master.gain.setValueAtTime(0.7, t0 + dur - 0.18);
      master.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      master.connect(ctx.destination);

      // Two slightly-detuned sawtooths produce the harsh "klaxon" beating.
      // A small downward pitch ramp gives the iconic end-of-game droop.
      for (const f of [220, 217]) {
        const o = ctx.createOscillator();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(f, t0);
        o.frequency.linearRampToValueAtTime(f * 0.92, t0 + dur);
        o.connect(master);
        o.start(t0);
        o.stop(t0 + dur);
      }
      // A perfect-fifth square on top adds upper-harmonic bite.
      const bite = ctx.createOscillator();
      const biteGain = ctx.createGain();
      bite.type = 'square';
      bite.frequency.setValueAtTime(330, t0);
      bite.frequency.linearRampToValueAtTime(303, t0 + dur);
      biteGain.gain.value = 0.35;
      bite.connect(biteGain); biteGain.connect(master);
      bite.start(t0);
      bite.stop(t0 + dur);
    } catch (e) {}
  }

  let pressTimer = null, longPressed = false;
  clockEl.addEventListener('pointerdown', () => {
    longPressed = false;
    clearTimeout(pressTimer);
    pressTimer = setTimeout(() => {
      longPressed = true;
      resetClock();
      if (navigator.vibrate) { try { navigator.vibrate(40); } catch (e) {} }
    }, 600);
  });
  const cancelPress = () => clearTimeout(pressTimer);
  clockEl.addEventListener('pointerleave', cancelPress);
  clockEl.addEventListener('pointercancel', cancelPress);
  clockEl.addEventListener('pointerup', () => {
    clearTimeout(pressTimer);
    if (longPressed) return;
    if (clockRunning) pauseClock();
    else startClock();
  });

  // --- Persistence: try localStorage, fall back to URL hash ---
  const STORAGE_KEY = 'scoreboard_state_v1';
  let useLocalStorage = true;
  try {
    localStorage.setItem('__test__', '1');
    localStorage.removeItem('__test__');
  } catch (e) {
    useLocalStorage = false;
  }

  function save() {
    const state = { a: scoreA, b: scoreB, q: quarter, na: nameA.value, nb: nameB.value, c: Math.round(getClockMs()) };
    if (useLocalStorage) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    } else {
      try { history.replaceState(null, '', '#' + btoa(JSON.stringify(state))); } catch (e) {}
    }
  }

  function load() {
    let raw = null;
    if (useLocalStorage) {
      try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) {}
    }
    if (!raw && location.hash.length > 1) {
      try { raw = atob(location.hash.slice(1)); } catch (e) {}
    }
    if (!raw) return;
    try {
      const s = JSON.parse(raw);
      scoreA = s.a || 0;
      scoreB = s.b || 0;
      quarter = s.q || 1;
      if (s.na) nameA.value = s.na;
      if (s.nb) nameB.value = s.nb;
      if (typeof s.c === 'number' && s.c >= 0) clockMs = s.c;
    } catch (e) {}
  }

  function render() {
    sa.textContent = scoreA;
    sb.textContent = scoreB;
    ql.textContent = 'QUARTER ' + quarter;
    save();
  }

  document.querySelectorAll('button[data-team]').forEach(btn => {
    btn.addEventListener('click', () => {
      const amt = parseInt(btn.dataset.amt, 10);
      if (btn.dataset.team === 'A') scoreA = Math.max(0, scoreA + amt);
      else scoreB = Math.max(0, scoreB + amt);
      render();
    });
  });

  document.getElementById('qPlus').addEventListener('click', () => {
    if (quarter < 9) quarter++;
    render();
  });
  document.getElementById('qMinus').addEventListener('click', () => {
    if (quarter > 1) quarter--;
    render();
  });

  nameA.addEventListener('input', () => { updateLogo(nameA, logoA, logoMiniA, seedA); save(); });
  nameB.addEventListener('input', () => { updateLogo(nameB, logoB, logoMiniB, seedB); save(); });

  document.querySelectorAll('button[data-clear]').forEach(btn => {
    btn.addEventListener('click', () => {
      const which = btn.dataset.clear;
      const input = which === 'A' ? nameA : nameB;
      const img = which === 'A' ? logoA : logoB;
      const mini = which === 'A' ? logoMiniA : logoMiniB;
      const seed = which === 'A' ? seedA : seedB;
      input.value = '';
      updateLogo(input, img, mini, seed);
      save();
      input.focus();
    });
  });

  document.getElementById('reset').addEventListener('click', () => {
    if (confirm('Beide scores en kwart herbeginnen?')) {
      scoreA = 0; scoreB = 0; quarter = 1;
      resetClock();
      render();
    }
  });

  // --- Voice scoring (Dutch) ---
  const toastEl = document.getElementById('toast');
  let toastTimer = null;
  function toast(msg, isErr) {
    toastEl.textContent = msg;
    toastEl.classList.toggle('err', !!isErr);
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  const NL_NUM = {
    een: 1, eentje: 1, 'één': 1, twee: 2, drie: 3,
    '1': 1, '2': 2, '3': 3
  };

  function parseUtterance(text) {
    const norm = normalizeName(text);
    if (!norm) return null;
    const tokens = norm.split(' ');
    let amount = null, sign = 1;
    const consumed = new Set();
    for (let i = 0; i < tokens.length; i++) {
      const tk = tokens[i];
      if (tk === 'min' || tk === 'minus' || tk === 'minder') { sign = -1; consumed.add(i); continue; }
      if (amount == null && NL_NUM[tk] != null) { amount = NL_NUM[tk]; consumed.add(i); continue; }
      if (tk === 'punt' || tk === 'punten' || tk === 'point' || tk === 'points' || tk === 'punteen') { consumed.add(i); }
    }
    if (amount == null) return null;
    const teamPart = tokens.filter((_, i) => !consumed.has(i)).join(' ').trim();
    if (!teamPart) return null;
    return { teamPart, amount: sign * amount };
  }

  function pickTeam(teamPart) {
    const matched = findTeam(teamPart);
    const aMatched = findTeam(nameA.value);
    const bMatched = findTeam(nameB.value);
    if (matched) {
      if (aMatched && matched.id === aMatched.id) return 'A';
      if (bMatched && matched.id === bMatched.id) return 'B';
    }
    const q = normalizeName(teamPart);
    const nA = normalizeName(nameA.value);
    const nB = normalizeName(nameB.value);
    const score = (a) => {
      if (!a) return Infinity;
      if (a.length >= 3 && (q.includes(a) || a.includes(q))) return 0;
      return lev(q, a) / Math.max(q.length, a.length);
    };
    const dA = score(nA), dB = score(nB);
    if (dA === Infinity && dB === Infinity) return null;
    if (Math.min(dA, dB) > 0.45) return null;
    return dA <= dB ? 'A' : 'B';
  }

  function applyVoice(text) {
    const parsed = parseUtterance(text);
    if (!parsed) return false;
    const which = pickTeam(parsed.teamPart);
    if (!which) return false;
    if (which === 'A') scoreA = Math.max(0, scoreA + parsed.amount);
    else scoreB = Math.max(0, scoreB + parsed.amount);
    render();
    const teamLabel = (which === 'A' ? nameA.value : nameB.value) || which;
    const sign = parsed.amount >= 0 ? '+' : '';
    toast(`${teamLabel} ${sign}${parsed.amount}`);
    return true;
  }

  // Local on-device Dutch speech recognition via vosk-browser.
  // Model lives in this repo, served by GitHub Pages (Fastly CDN, CORS:*).
  // jsDelivr's /gh/ endpoint can't be used here — its 20 MB per-file limit
  // rejects this 40 MB tar.gz with a 403.
  const VOSK_MODEL_URL =
    'https://michaelmarien.github.io/personal/scoreboard/models/vosk-model-small-nl-0.22.tar.gz';
  const micBtn = document.getElementById('mic');
  const micLabel = document.getElementById('micLabel');
  let voskModel = null;
  let voskRecognizer = null;
  let audioCtx = null;
  let micStream = null;
  let micNode = null;
  let micSource = null;
  let micOn = false;
  let modelLoading = false;

  // Vocabulary: numbers + "punt(en)"/"min" + every word that appears in any
  // team alias. Constraining the recognizer to this set dramatically improves
  // accuracy on a small fixed-vocab task like scoring.
  function buildVocab() {
    const words = new Set([
      '[unk]',
      'een', 'eentje', 'twee', 'drie',
      'punt', 'punten',
      'min', 'minus'
    ]);
    for (const t of TEAMS) {
      for (const alias of t.names) {
        for (const tk of normalizeName(alias).split(' ')) {
          if (tk.length >= 2 && !/^[0-9]+$/.test(tk)) words.add(tk);
        }
      }
    }
    return JSON.stringify([...words]);
  }

  function setMicLabel(text) { micLabel.textContent = text; }
  function updateMicUI() {
    micBtn.classList.toggle('on', micOn);
    setMicLabel(micOn ? 'Luistert…' : 'Spraak');
  }

  if (!window.Vosk) {
    micBtn.disabled = true;
    micBtn.style.opacity = 0.5;
    setMicLabel('Geen spraak');
  }

  async function ensureModel() {
    if (voskModel) return voskModel;
    if (modelLoading) return null;
    modelLoading = true;
    setMicLabel('Model laden…');
    micBtn.disabled = true;
    try {
      voskModel = await Vosk.createModel(VOSK_MODEL_URL);
      return voskModel;
    } catch (e) {
      toast('Model niet geladen', true);
      throw e;
    } finally {
      modelLoading = false;
      micBtn.disabled = false;
      updateMicUI();
    }
  }

  async function startMic() {
    const model = await ensureModel();
    if (!model) return;
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true }
    });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    voskRecognizer = new model.KaldiRecognizer(audioCtx.sampleRate, buildVocab());
    voskRecognizer.on('result', (msg) => {
      const text = ((msg.result && msg.result.text) || '').trim();
      if (!text || text === '[unk]') return;
      // Strip stray [unk] tokens that Vosk sometimes inserts.
      const cleaned = text.replace(/\[unk\]/g, '').replace(/\s+/g, ' ').trim();
      if (!cleaned) return;
      if (!applyVoice(cleaned)) toast(`? ${cleaned}`, true);
    });
    micSource = audioCtx.createMediaStreamSource(micStream);
    micNode = audioCtx.createScriptProcessor(4096, 1, 1);
    micNode.onaudioprocess = (ev) => {
      try { voskRecognizer.acceptWaveform(ev.inputBuffer); } catch (e) {}
    };
    micSource.connect(micNode);
    micNode.connect(audioCtx.destination);
    micOn = true;
    updateMicUI();
  }

  function stopMic() {
    micOn = false;
    if (micNode) { try { micNode.disconnect(); } catch (e) {} micNode = null; }
    if (micSource) { try { micSource.disconnect(); } catch (e) {} micSource = null; }
    if (voskRecognizer) { try { voskRecognizer.remove(); } catch (e) {} voskRecognizer = null; }
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    if (audioCtx) { try { audioCtx.close(); } catch (e) {} audioCtx = null; }
    updateMicUI();
  }

  micBtn.addEventListener('click', async () => {
    if (!window.Vosk) return;
    if (micOn) { stopMic(); return; }
    try { await startMic(); }
    catch (e) {
      stopMic();
      const msg = (e && e.name === 'NotAllowedError') ? 'Microfoon geweigerd' : 'Kon mic niet starten';
      toast(msg, true);
    }
  });

  // Prevent double-tap zoom on iOS
  document.addEventListener('touchstart', function(e){ if(e.touches.length>1) e.preventDefault(); }, {passive:false});
  let lastTap = 0;
  document.addEventListener('touchend', function(e){
    const now = Date.now();
    if (now - lastTap < 300 && e.target.tagName !== 'INPUT') e.preventDefault();
    lastTap = now;
  }, {passive:false});

  // Keep screen awake (iPadOS 16.4+, modern browsers)
  let wakeLock = null;
  async function requestWakeLock() {
    if (!('wakeLock' in navigator)) return;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && !wakeLock) requestWakeLock();
  });
  requestWakeLock();

  // --- Player roster / stats modal ---
  const teamById = Object.fromEntries(TEAMS.map(t => [t.id, t]));
  const modal = document.getElementById('playerModal');
  const modalBody = document.getElementById('modalBody');
  const modalTitle = document.getElementById('modalTitle');
  const modalLogo = document.getElementById('modalLogo');
  const modalBack = document.getElementById('modalBack');
  const modalClose = document.getElementById('modalClose');
  let modalTeamId = null;

  function esc(s) {
    return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  }
  const POS_NAME = { PG:'Point Guard', SG:'Shooting Guard', SF:'Small Forward', PF:'Power Forward', C:'Center' };

  function showRosterList() {
    const data = ROSTERS[modalTeamId];
    modalBack.style.display = 'none';
    modalTitle.innerHTML = `${esc(data.city)} ${esc(data.name)}<small>${data.players.length} spelers · tik op een speler</small>`;
    modalBody.innerHTML = data.players.map((p, i) =>
      `<div class="roster-row" data-idx="${i}">
         <span class="roster-no">${esc(p.no)}</span>
         <span class="roster-name">${esc(p.n)}</span>
         <span class="roster-pos">${esc(p.pos)}</span>
         <span class="roster-pts">${p.ppg.toFixed(1)} ppg</span>
       </div>`).join('');
    modalBody.scrollTop = 0;
  }

  function showPlayer(idx) {
    const data = ROSTERS[modalTeamId];
    const p = data.players[idx];
    if (!p) return;
    modalBack.style.display = '';
    modalTitle.innerHTML = `${esc(data.city)} ${esc(data.name)}<small>Statistieken 2025-26</small>`;
    const cells = [
      ['PPG', p.ppg.toFixed(1)], ['RPG', p.rpg.toFixed(1)], ['APG', p.apg.toFixed(1)],
      ['SPG', p.spg.toFixed(1)], ['BPG', p.bpg.toFixed(1)], ['MPG', p.mpg.toFixed(1)],
      ['FG%', p.fg.toFixed(1)], ['3P%', p.tp.toFixed(1)], ['FT%', p.ft.toFixed(1)],
      ['GP', String(p.gp)]
    ];
    modalBody.innerHTML =
      `<div class="player-detail">
         <h3>${esc(p.n)}</h3>
         <div class="meta">#${esc(p.no)} · ${esc(POS_NAME[p.pos] || p.pos)}</div>
         <div class="stat-grid">
           ${cells.map(([l, v]) => `<div class="stat-cell"><div class="val">${esc(v)}</div><div class="lbl">${esc(l)}</div></div>`).join('')}
         </div>
       </div>`;
    modalBody.scrollTop = 0;
  }

  function openRoster(teamId) {
    if (!ROSTERS[teamId]) return;
    modalTeamId = teamId;
    const team = teamById[teamId];
    if (team) modalLogo.src = team.logo; else modalLogo.removeAttribute('src');
    showRosterList();
    modal.classList.add('show');
    modal.setAttribute('aria-hidden', 'false');
  }

  function closeModal() {
    modal.classList.remove('show');
    modal.setAttribute('aria-hidden', 'true');
    modalTeamId = null;
  }

  modalBody.addEventListener('click', e => {
    const row = e.target.closest('.roster-row');
    if (row) showPlayer(parseInt(row.dataset.idx, 10));
  });
  modalBack.addEventListener('click', showRosterList);
  modalClose.addEventListener('click', closeModal);
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal.classList.contains('show')) closeModal(); });

  logoMiniA.addEventListener('click', () => { if (logoMiniA.dataset.tid) openRoster(logoMiniA.dataset.tid); });
  logoMiniB.addEventListener('click', () => { if (logoMiniB.dataset.tid) openRoster(logoMiniB.dataset.tid); });

  load();
  render();
  renderClock();
  updateLogo(nameA, logoA, logoMiniA, seedA);
  updateLogo(nameB, logoB, logoMiniB, seedB);
</script>
</body>
</html>
